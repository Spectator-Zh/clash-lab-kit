manifest-version: 1
config-schema-version: 1
app-version: v1.2.0

# 按新到旧保留当前正式 Release 基线内的全部补丁版本。第一项必须与 app-version
# 一致；clash update app 会根据已安装版本，仅显示本次跨越的版本条目。
user-facing-changes:
  - version: v1.2.0
    items:
      - 新增 clash version，可查看当前程序版本和提交
      - 程序更新后当前终端自动生效，并显示版本变化和更新内容
      - Web 管理端默认仅本机访问，远程使用 SSH 端口转发
      - 安装后可选择开启登录自动启动和订阅自动更新
      - 运行环境统一为 Bash，不再支持 Zsh
      - 还有一些稳定性、安全性和使用体验优化

# clash update app 会校验并事务化更新 files 中声明的普通文件。
# template 文件只更新默认模板，不覆盖用户正在使用的 mixin.yaml。
